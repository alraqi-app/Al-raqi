<!DOCTYPE html>
<html dir="rtl" lang="ur">
<head>
  <meta property="og:image" content="https://alraqi-app.github.io/Al-raqi/og-banner.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="application-name" content="الراقی">
  <meta name="apple-mobile-web-app-title" content="الراقی">
  <meta name="theme-color" content="#0b1936">
  <meta property="og:type" content="website">
  <meta property="og:title" content="الراقی — روحانی تشخیص، استخارہ و قرآنی علاج">
  <meta property="og:description" content="علم الاعداد، استخارہ، مستند قرآنی وظائف، عنصری نقوش اور تعبیر الرؤیا کا جامع ڈیجیٹل پورٹل۔">
  <meta property="og:image" content="https://alraqi-app.github.io/Al-raqi/Code_Generated_Image.png">
  <title>الراقی</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b1936;font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq',Tahoma,sans-serif}
    #alRaqiSplash{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 35%,#1e3a8a 0%,#0b1936 74%);color:#fef08a;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;direction:rtl;text-align:center;transition:opacity 0.35s ease}
    .rq-logo{width:142px;height:142px;border-radius:50%;object-fit:contain;margin-bottom:14px;box-shadow:0 14px 36px rgba(0,0,0,0.55);border:2px solid rgba(212,175,55,0.6)}
    .rq-ar-title{font-family:'Amiri','Noto Nastaliq Urdu',serif;font-size:3rem;font-weight:700;margin:0 0 6px;background:linear-gradient(180deg,#fff8db 0%,#eac870 50%,#b88628 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2}
    .rq-tagline{color:#e2e8f0;font-size:0.95rem;margin:0 0 24px;opacity:0.92}
    .rq-loader-wrap{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,0.08);border:1px solid rgba(212,175,55,0.45);padding:8px 18px;border-radius:999px;font-size:0.86rem;color:#fef08a}
    .rq-spin{width:16px;height:16px;border:2.5px solid rgba(254,240,138,0.28);border-top-color:#fef08a;border-radius:50%;animation:rqRot 0.75s linear infinite}
    @keyframes rqRot{to{transform:rotate(360deg)}}
    #alRaqiFullFrame{position:fixed;top:-34px;left:0;width:100vw;height:calc(100vh + 34px);border:0;z-index:10;background:#0b1936}
    #rqFloatingInstall{position:fixed;bottom:14px;left:14px;z-index:9998;background:linear-gradient(135deg,#facc15,#d4af37);color:#0b1936;border:2px solid #0b1936;padding:8px 16px;border-radius:999px;font-weight:800;font-size:0.85rem;cursor:pointer;font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,0.45);display:none;align-items:center;gap:6px}
  </style>
</head>
<body>
  <div id="alRaqiSplash">
    <img id="rqSplashLogoImg" class="rq-logo" src="./icon-512.png" alt="الراقی">
    <h1 class="rq-ar-title">الراقی</h1>
    <p class="rq-tagline">روحانی تشخیص، استخارہ و قرآنی علاج</p>
    <div class="rq-loader-wrap">
      <span class="rq-spin"></span>
      <span>خوش آمدید...</span>
    </div>
  </div>

  <button type="button" id="rqFloatingInstall" onclick="window.triggerAlRaqiInstall()">📲 ایپ انسٹال کریں</button>
  <iframe id="alRaqiFullFrame" allow="clipboard-read; clipboard-write; fullscreen"></iframe>

  <script>
    (function () {
      var GAS_LIVE_URL = "https://script.google.com/macros/s/AKfycbzKlQ08MZlyKir8IvIZkqLrych04BuJYseRe2_Bb2xcDTu39qfguH4rmqFdqqc9Fkgl7g/exec";
      var deferredPrompt = null;
      var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {});
        });
      }

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        if (!isStandalone) {
          var fl = document.getElementById('rqFloatingInstall');
          if (fl) fl.style.display = 'inline-flex';
        }
      });

      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        var fl = document.getElementById('rqFloatingInstall');
        if (fl) fl.style.display = 'none';
      });

      window.triggerAlRaqiInstall = function () {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function () { deferredPrompt = null; });
        }
      };

      window.hideAlRaqiSplashNow = function () {
        var sp = document.getElementById('alRaqiSplash');
        if (sp && sp.style.display !== 'none') {
          sp.style.opacity = '0';
          setTimeout(function () { sp.style.display = 'none'; }, 300);
        }
      };

      var fr = document.getElementById('alRaqiFullFrame');
      if (fr) {
        fr.onload = function () { setTimeout(window.hideAlRaqiSplashNow, 400); };
        fr.src = GAS_LIVE_URL;
      }

      window.addEventListener('message', function (ev) {
        if (!ev || !ev.data) return;
        if (ev.data.type === 'AL_RAQI_APP_READY') {
          window.hideAlRaqiSplashNow();
        } else if (ev.data.type === 'AL_RAQI_THEME_SYNC' && ev.data.logoUri) {
          var sImg = document.getElementById('rqSplashLogoImg');
          if (sImg) sImg.src = ev.data.logoUri;
        }
      });
    })();
  </script>
</body>
</html>
